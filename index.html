<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Qronos CLI — the terminal that thinks in workflows</title>
    <meta
      name="description"
      content="An AI coding agent in your terminal. Real tools, real edits, a 10-minute workflow engine, memory that survives the session. Free to start, MIT licensed."
    />
    <!--
      Opt in to scroll reveals only when the reader allows motion, and only if
      JavaScript is running. Without this class the content is visible at once:
      a hidden state must never depend on a script that might fail.
    -->
    <script>
      if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("js-motion");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
