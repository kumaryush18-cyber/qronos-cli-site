name: deploy

# Deploy only what `site.yml` verified: this workflow waits for that one to pass
# on the same commit, then uploads the built `dist/` to Azure Static Web Apps.
#
# One secret is required, and only this workflow sees it:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  — from the Static Web App's "Manage
#                                      deployment token" blade.
on:
  workflow_run:
    workflows: [site]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: deploy to Azure Static Web Apps
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://cli.qronos.me
    steps:
      - name: Say which commit is going out
        run: echo "deploying ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Check the deployment token exists
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "dist"
          # The build already happened in `site.yml`; Azure only uploads.
          skip_app_build: true
