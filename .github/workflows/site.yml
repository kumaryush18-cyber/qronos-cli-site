name: site

# Verify every push and pull request. Nothing here needs a secret, so a fork can
# run it too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch; a new push cancels the old one instead of racing it.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Generated docs sources are up to date
        run: npm run check:docs

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (client, server, prerender)
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the built site
        run: |
          node scripts/serve-static.mjs dist 4173 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done

      - name: Accessibility, layout shift, dead anchors
        run: node scripts/check.mjs http://127.0.0.1:4173

      - name: Motion and no-JavaScript readability
        run: node scripts/check-motion.mjs http://127.0.0.1:4173

      - name: Prerendered HTML really contains the page
        run: |
          set -euo pipefail
          # Grep a file, never a pipe into `grep -q`: grep exits on the first
          # match, the writer gets SIGPIPE, and `pipefail` then calls it a failure.
          curl -sf http://127.0.0.1:4173/docs/workflows -o /tmp/workflows.html
          curl -sf http://127.0.0.1:4173/sitemap.xml -o /tmp/sitemap.xml
          curl -sf http://127.0.0.1:4173/robots.txt -o /tmp/robots.txt

          grep -q "ultracode" /tmp/workflows.html || { echo "docs page has no article text"; exit 1; }
          grep -q "<title>Workflows — Qronos CLI</title>" /tmp/workflows.html || { echo "wrong title"; exit 1; }
          grep -q "BreadcrumbList" /tmp/workflows.html || { echo "no breadcrumb data"; exit 1; }
          grep -q "/docs/privacy" /tmp/sitemap.xml || { echo "sitemap is missing a page"; exit 1; }
          grep -q "Sitemap:" /tmp/robots.txt || { echo "robots.txt does not point at the sitemap"; exit 1; }
          echo "the HTML holds the article, the title, the breadcrumb and the sitemap"

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 5

  deploy:
    name: deploy to Azure Static Web Apps
    # Only a green verify on main goes out. A pull request stops at `verify`.
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://cli.qronos.me
    steps:
      - name: Check the deployment token exists
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi

      # The artifact comes from the job that just verified this exact commit, so
      # what is deployed is byte for byte what the checks ran against.
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "dist"
          # The build already happened in `verify`; Azure only uploads.
          skip_app_build: true
